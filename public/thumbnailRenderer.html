<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Thumbnail Renderer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import {
        Scene,
        PerspectiveCamera,
        WebGLRenderer,
        AmbientLight,
        DirectionalLight
      } from "https://esm.sh/three";
      import { GLTFLoader } from "https://esm.sh/three/examples/jsm/loaders/GLTFLoader.js";

      const urlParams = new URLSearchParams(window.location.search);
      const modelPath = urlParams.get("model");

      const scene = new Scene();
      const camera = new PerspectiveCamera(40, 1, 0.1, 100);
      camera.position.set(0.25, 1.7, 8);

      const renderer = new WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(512, 512);
      renderer.setClearColor(0x000000, 0); // 0 = fully transparent
      document.body.appendChild(renderer.domElement);

      // lighting
      const ambientLight = new AmbientLight(0xffffff, 2);
      scene.add(ambientLight);

      const directionalLight = new DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);

      const loader = new GLTFLoader();
      loader.load(
        modelPath,
        (gltf) => {
          scene.add(gltf.scene);
          renderer.render(scene, camera);
          window.__screenshotReady = true;
        },
        undefined,
        (err) => console.error("GLTF Load Error:", err)
      );
    </script>
  </body>
</html>
